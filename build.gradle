plugins { id 'net.fabricmc.fabric-loom' version '1.17.21' }
version = '0.7.1'
group = 'dev.casz'
base { archivesName = 'linked-aquariums' }
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:26.2'
 implementation 'net.fabricmc:fabric-loader:0.19.5'
 implementation 'net.fabricmc.fabric-api:fabric-api:0.158.0+26.2'
}
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
fabricApi {
 configureTests {
  createSourceSet = true
  modId = 'linked_aquariums_test'
  enableGameTests = true
  enableClientGameTests = true
  eula = true
 }
}
