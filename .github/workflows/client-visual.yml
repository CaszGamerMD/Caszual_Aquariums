name: Client visual smoke test
on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'build.gradle'
      - '.github/workflows/client-visual.yml'
  workflow_dispatch:

jobs:
  client-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Launch Minecraft client and verify rendered editor
        run: xvfb-run -a ./gradlew runClientGameTest --stacktrace
      - name: Preserve client screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-visual-screenshots
          path: |
            **/screenshots/*.png
            **/screenshots/**/*.png
            **/reports/**/*.html
          if-no-files-found: ignore
