name: build
on:
  push:
    branches: [ main, feature/enclosure-editor, feature/editor-movement-polish ]
    tags: [ 'v*' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew build --stacktrace
      - name: Run client visual smoke test
        if: github.ref == 'refs/heads/feature/editor-movement-polish'
        run: xvfb-run -a ./gradlew runClientGameTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: linked-aquariums-build
          path: build/libs/*.jar
      - name: Publish GitHub release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
